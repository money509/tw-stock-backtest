name: 擠壓+KDJ 每日訊號(收盤後掃描)

# 每個交易日收盤後掃一次全部股票期貨標的，結果寫進 signals/latest.md(隔天開盤前用手機看)，
# 同時保留 signals/YYYY-MM-DD.md / .csv 當歷史紀錄，並commit回repo。
# 同一批訊號產生兩個清單：個股期貨清單(期貨流動性夠的才列，資料來自期交所)、現股清單(固定金額買現股，參考用)。
# Telegram每天送兩則：signals/telegram_futures.txt(期貨，主要)、signals/telegram_stock.txt(現股)。
# 期交所資料的原始回應/解析報告在 signals/debug/(每天覆寫，也會commit、也在artifact裡)，第一次跑完請檢查。
#
# 排程注意事項：
#  - GitHub的cron一律是UTC。"0 11 * * 1-5" = 週一~週五 UTC 11:00 = 台北時間 19:00(台灣沒有夏令時間)。
#    台股13:30收盤，留5個半小時給資料源(yfinance/Yahoo)更新當天日K。
#  - GitHub排程常常會延遲(尖峰時段延遲幾分鐘到一小時以上都有)，偶爾甚至會漏跑；
#    如果早上看到 latest.md 的日期不是昨天(上一個交易日)，請手動到Actions頁面按 Run workflow。
#  - 國定假日(休市)也會照跑：那天沒有新資料，latest.md 會顯示「資料還沒更新」的警告，忽略即可。
#  - 排程只會在預設分支(default branch)上執行；這個檔案要合併進預設分支才會開始自動跑。
#  - repo連續60天沒有任何活動，GitHub會自動停用排程；這裡每天commit signals/ 本身就算活動，
#    正常情況下不會被停用(如果被停用了，到Actions頁面重新Enable即可)。

on:
  schedule:
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      as_of:
        description: '訊號日(YYYY-MM-DD)，留空=今天(台北時間)；用來回補或測試某一天'
        required: false
        default: ''
      capital:
        description: '帳戶資金(新台幣)，用來判斷單筆保證金是否超過35%上限'
        required: false
        default: '200000'
      # 實盤設定(compare_breakout.py的SQUEEZE_KDJ_LIVE_SETTINGS)：停損1.5倍ATR、限價收盤+2檔，停利依持倉數。
      # 排程(每天自動跑)沒有inputs，一律用下面Scan signals步驟裡的預設值1。
      # 如果你決定長期改成同時持有2檔：把這裡的default改成'2'，並把Scan signals步驟裡的 POSITIONS 預設值 1 改成 2。
      positions:
        description: '同時最多持有幾檔：1=停利4倍ATR、2=停利3倍ATR'
        type: choice
        options:
          - '1'
          - '2'
        required: false
        default: '1'
      # 兩個清單的參數(排程沒有inputs，一律用下面Scan signals步驟裡的預設值)。
      stock_amount:
        description: '現股清單：每筆固定金額(新台幣，可零股)'
        required: false
        default: '100000'
      fut_min_volume:
        description: '期貨清單：實際交易契約5日平均成交量下限(口，全部月份+一般/盤後加總)'
        required: false
        default: '100'
      fut_min_oi:
        description: '期貨清單：近月未平倉下限(口)'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: daily-squeeze-signals
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 只跑掃描器自己的測試當開跑前檢查(包含「跟回測逐日一致」的比對)，不跑整套測試，保持快速。
      - name: Pre-flight test
        run: python -m pytest -q test_daily_squeeze_signals.py test_taifex_futures_loader.py

      # 不使用 actions/cache：掃描器每次都強制重新下載(refresh)，避免讀到資料還沒更新時的舊快取。
      - name: Scan signals
        env:
          AS_OF: ${{ github.event.inputs.as_of }}
          CAPITAL: ${{ github.event.inputs.capital }}
          # 排程執行時github.event.inputs是空的 → 用1(同時最多1檔)。長期改2檔時這裡的 '1' 也要改成 '2'。
          POSITIONS: ${{ github.event.inputs.positions || '1' }}
          STOCK_AMOUNT: ${{ github.event.inputs.stock_amount || '100000' }}
          FUT_MIN_VOLUME: ${{ github.event.inputs.fut_min_volume || '100' }}
          FUT_MIN_OI: ${{ github.event.inputs.fut_min_oi || '300' }}
          SIGNALS_LINK: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/signals/latest.md
        run: |
          ARGS="--output-dir signals --positions ${POSITIONS:-1}"
          ARGS="$ARGS --stock-amount ${STOCK_AMOUNT:-100000} --fut-min-volume ${FUT_MIN_VOLUME:-100} --fut-min-oi ${FUT_MIN_OI:-300}"
          if [ -n "$AS_OF" ]; then
            ARGS="$ARGS --as-of $AS_OF"
          fi
          if [ -n "$CAPITAL" ]; then
            ARGS="$ARGS --capital $CAPITAL"
          fi
          python daily_squeeze_signals.py $ARGS

      # Telegram推播：需要在repo的 Settings → Secrets and variables → Actions 新增兩個secret：
      #   TELEGRAM_BOT_TOKEN(@BotFather給的機器人金鑰)、TELEGRAM_CHAT_ID(你的聊天ID)。
      # 沒設定時這一步直接略過，不影響掃描本身。訊息用純文字送出(不設parse_mode)，避免特殊字元出錯。
      # 放在commit之前：就算之後commit/push失敗，推播一樣已經送出。
      # 每天兩則：先送期貨清單(主要)，再送現股清單。其中一則失敗，另一則照送；這一步標紅但不讓整個job失敗。
      - name: Send Telegram messages
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "沒有設定TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID，略過Telegram推播"
            exit 0
          fi
          FAILED=0
          for f in signals/telegram_futures.txt signals/telegram_stock.txt; do
            if [ ! -s "$f" ]; then
              echo "找不到 $f 或是空的，略過"
              FAILED=1
              continue
            fi
            RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text@${f}" \
              --data-urlencode "disable_web_page_preview=true") || true
            if echo "$RESP" | grep -q '"ok":true'; then
              echo "Telegram推播成功：$f"
            else
              echo "Telegram推播失敗($f，Telegram回應)：$RESP"
              FAILED=1
            fi
          done
          exit $FAILED

      # signals/debug/(期交所原始回應前200行 + parse_report.json，每天覆寫、很小)也一起commit，方便檢查真實格式。
      - name: Commit signals back to repo
        env:
          AS_OF: ${{ github.event.inputs.as_of }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals/
          if git diff --cached --quiet; then
            echo "signals/ 沒有變更，不commit"
            exit 0
          fi
          git commit -m "擠壓+KDJ每日訊號 ${AS_OF:-$(TZ=Asia/Taipei date +%F)}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push失敗，第${i}次重試 ..."
            sleep 5
          done
          exit 1

      - name: Upload signals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-squeeze-signals
          path: signals/
          if-no-files-found: warn
