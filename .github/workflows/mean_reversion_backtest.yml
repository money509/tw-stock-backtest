name: Run Momentum Breakout Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '回測起始日期 (YYYY-MM-DD)，預設抓最近3年'
        required: false
        default: ''
      end_date:
        description: '回測結束日期，留空代表跑到今天'
        required: false
        default: ''
      starting_capital:
        description: '模擬帳戶起始資金(新台幣)'
        required: false
        default: '200000'
      max_stocks:
        description: '限制掃描股票數量，0代表全部320檔(第一次測試建議先設50，跑比較快)'
        required: false
        default: '50'
      with_chip_confirm:
        description: '是否額外測試外資連續買超確認訊號(需要多下載三大法人資料，會跑比較久)'
        required: false
        default: 'false'
      clean_ex_dividend:
        description: '是否排除除權息當天的股票(避免機械性跳空污染訊號，需要多下載除權息資料，會跑久一點)'
        required: false
        default: 'false'
      use_trailing_stop:
        description: '出場是否改用移動停利(不設固定天數/固定停利目標價，讓獲利奔跑)，取代原本短線5天/中期15天比較'
        required: false
        default: 'false'
      atr_stop_mult:
        description: '初始停損的ATR倍數(移動停利模式下只用在對照組，最佳組合的倍數會由ATR敏感度網格自動搜出)'
        required: false
        default: '1.0'
      trailing_atr_mult:
        description: '移動停利的ATR倍數，留空代表跟初始停損用同一個值(同樣只用在對照組)'
        required: false
        default: ''
      slippage_pct:
        description: '進場/停損出場的滑價假設，例如0.002代表0.2%，留空或0代表不模擬滑價'
        required: false
        default: '0'
      max_concurrent_positions:
        description: '最佳組合最終驗證時允許同時持有的最大部位數，預設1(一次一個部位)，>1代表多部位並行'
        required: false
        default: '1'
      risk_pct_per_trade:
        description: '最佳組合改用風險預算式部位大小的比例，例如0.02代表每筆風險2%帳戶權益，留空代表維持固定2口'
        required: false
        default: ''
      multi_period_test:
        description: '是否額外把最佳組合套到2022年修正段/2021下半年盤整段這兩個跟近期多頭不同市況的期間驗證(會多跑久一點)'
        required: false
        default: 'false'
      walkforward_folds:
        description: '走勢前進(Walk-Forward)分折驗證的折數，0代表不啟用(預設)。設3之類的數字會額外把歷史切成N+1個等長區塊，每折重新選一次訊號/門檻/出場配置並在自己的測試窗口驗證，用來檢查選出的組合跨時間是否穩定(會多跑久一點，且是全新階段、實際耗時還沒校準過，建議先從小數字開始試)'
        required: false
        default: '0'
      fixed_combo_walkforward_folds:
        description: '固定規則walk-forward驗證的區塊數，0代表不啟用(預設)。設6之類的數字會把同一組已經連續兩輪被自動選中的固定規則(不重新挑選任何訊號/門檻/ATR倍數/出場配置)，原封不動套到N個獨立、不重疊的歷史區塊各跑一次，檢查這組已定案的規則本身跨時間是否穩定。因為規則固定、不用每折重跑整套選擇流程，成本比walkforward_folds低很多，建議值6'
        required: false
        default: '0'
      simple_combo:
        description: '簡化模式(--simple-combo)：開啟後完全跳過上面突破窗口比較/突破風格比較/訊號自動搜尋/門檻網格/ATR網格/出場配置網格這整套6階段樣本內(IS)自動選擇流程，改成只測固定訊號組合(MACD柱狀圖+K棒實體比例)搭配三組累加門檻(無門檻→+趨勢強度ADX→+趨勢強度+大盤氛圍regime濾網)，出場固定用移動停利。開這個選項的理由：一次完整流程的真實執行結果顯示，連續6輪都在同一份樣本內(IS)資料上挑贏家，疊加起來的多重比較(multiple comparisons)問題嚴重到讓選出的「最佳組合」樣本內PF=1.41、但樣本外(OOS)PF只有0.48、bootstrap正報酬比例只有5.2%——這個簡化模式刻意固定訊號組合、不自動搜尋任何東西，只比較「加不加這兩道門檻」，用來避開同一種overfitting風險。開啟後，上面max_stocks/starting_capital/atr_stop_mult/trailing_atr_mult/start_date/end_date仍然有效，其餘跟訊號/門檻/突破窗口/出場配置自動搜尋相關的選項會被忽略(對應的階段整個不會執行)'
        required: false
        default: 'false'
      combo_search:
        description: '單一訊號混搭搜尋模式(--combo-search)：跟simple_combo不同的是，這裡仍然會先用單一訊號拆解(逐一測試每個訊號，含開啟with_chip_confirm時的籌碼相關訊號)，並排測試兩個「混搭」候選：候選1用PF>1且交易數夠多的訊號等權重組成(select_winning_signals，沒有任何訊號PF>1時退回總損益前3名並標記探索性選擇)；候選2把這次消融測過的「全部」單一訊號(含with_chip_confirm時的籌碼訊號)不篩選、直接等權重混在一起。兩個候選各自固定下來後，突破窗口/突破風格/結構門檻/ATR倍數/出場配置都不再搜尋，直接套用ADX趨勢強度濾網+大盤氛圍regime濾網+移動停利，各自比照simple_combo跑三組累加門檻比較+最終樣本內/樣本外(IS/OOS)+bootstrap驗證，結果輸出到combo_search_variants.csv/trades_OOS_combo_search_filtered.csv(候選1)跟combo_search_variants_allsignals.csv/trades_OOS_combo_search_allsignals.csv(候選2)，summary.txt用並排表格直接比較兩者的OOS表現。簡單說：simple_combo測的是一組使用者已經確認過、完全寫死的訊號組合；combo_search仍然會搜尋「哪些單一訊號該混搭在一起」，而且一次測兩種挑法，比完整6階段流程的多重比較風險低很多。開啟後，上面max_stocks/starting_capital/atr_stop_mult/trailing_atr_mult/start_date/end_date/with_chip_confirm仍然有效(with_chip_confirm開啟時，候選2的「全部混搭」也會把籌碼訊號一起混進去)，其餘跟突破窗口/突破風格/門檻/ATR/出場配置自動搜尋相關的選項會被忽略(對應的階段整個不會執行)'
        required: false
        default: 'false'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore price data cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: price-data-cache-${{ github.run_id }}
          restore-keys: |
            price-data-cache-

      - name: Run momentum breakout backtest
        timeout-minutes: 150
        run: |
          ARGS="--starting-capital ${{ github.event.inputs.starting_capital }} --max-stocks ${{ github.event.inputs.max_stocks }}"
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            ARGS="$ARGS --start ${{ github.event.inputs.start_date }}"
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS="$ARGS --end ${{ github.event.inputs.end_date }}"
          fi
          if [ "${{ github.event.inputs.with_chip_confirm }}" = "true" ]; then
            ARGS="$ARGS --with-chip-confirm"
          fi
          if [ "${{ github.event.inputs.clean_ex_dividend }}" = "true" ]; then
            ARGS="$ARGS --clean-ex-dividend"
          fi
          if [ "${{ github.event.inputs.use_trailing_stop }}" = "true" ]; then
            ARGS="$ARGS --use-trailing-stop"
          fi
          if [ -n "${{ github.event.inputs.atr_stop_mult }}" ]; then
            ARGS="$ARGS --atr-stop-mult ${{ github.event.inputs.atr_stop_mult }}"
          fi
          if [ -n "${{ github.event.inputs.trailing_atr_mult }}" ]; then
            ARGS="$ARGS --trailing-atr-mult ${{ github.event.inputs.trailing_atr_mult }}"
          fi
          if [ -n "${{ github.event.inputs.slippage_pct }}" ] && [ "${{ github.event.inputs.slippage_pct }}" != "0" ]; then
            ARGS="$ARGS --slippage-pct ${{ github.event.inputs.slippage_pct }}"
          fi
          if [ -n "${{ github.event.inputs.max_concurrent_positions }}" ]; then
            ARGS="$ARGS --max-concurrent-positions ${{ github.event.inputs.max_concurrent_positions }}"
          fi
          if [ -n "${{ github.event.inputs.risk_pct_per_trade }}" ]; then
            ARGS="$ARGS --risk-pct-per-trade ${{ github.event.inputs.risk_pct_per_trade }}"
          fi
          if [ "${{ github.event.inputs.multi_period_test }}" = "true" ]; then
            ARGS="$ARGS --multi-period-test"
          fi
          if [ -n "${{ github.event.inputs.walkforward_folds }}" ] && [ "${{ github.event.inputs.walkforward_folds }}" != "0" ]; then
            ARGS="$ARGS --walkforward-folds ${{ github.event.inputs.walkforward_folds }}"
          fi
          if [ -n "${{ github.event.inputs.fixed_combo_walkforward_folds }}" ] && [ "${{ github.event.inputs.fixed_combo_walkforward_folds }}" != "0" ]; then
            ARGS="$ARGS --fixed-combo-walkforward-folds ${{ github.event.inputs.fixed_combo_walkforward_folds }}"
          fi
          if [ "${{ github.event.inputs.simple_combo }}" = "true" ]; then
            ARGS="$ARGS --simple-combo"
          fi
          if [ "${{ github.event.inputs.combo_search }}" = "true" ]; then
            ARGS="$ARGS --combo-search"
          fi
          python compare_breakout.py $ARGS

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: momentum-breakout-results
          path: results_breakout/
