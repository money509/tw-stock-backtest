name: Validate Best Combo (Different Time Period)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '驗證期間起始日期 (YYYY-MM-DD)，預設2021-01-01'
        required: false
        default: '2021-01-01'
      end_date:
        description: '驗證期間結束日期，預設2023-01-01'
        required: false
        default: '2023-01-01'
      starting_capital:
        description: '模擬帳戶起始資金(新台幣)'
        required: false
        default: '200000'
      max_stocks:
        description: '限制掃描股票數量，0代表全部320檔'
        required: false
        default: '0'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore price data cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: price-data-cache-validate-${{ github.run_id }}
          restore-keys: |
            price-data-cache-validate-
            price-data-cache-

      - name: Run validation
        timeout-minutes: 90
        run: |
          python validate_best_combo.py \
            --start ${{ github.event.inputs.start_date }} \
            --end ${{ github.event.inputs.end_date }} \
            --starting-capital ${{ github.event.inputs.starting_capital }} \
            --max-stocks ${{ github.event.inputs.max_stocks }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: results_validation/
