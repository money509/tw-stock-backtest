name: Run Revenue Drift Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '回測起始日期 (YYYY-MM-DD)，預設抓最近3年'
        required: false
        default: ''
      end_date:
        description: '回測結束日期，留空代表跑到今天'
        required: false
        default: ''
      starting_capital:
        description: '模擬帳戶起始資金(新台幣)'
        required: false
        default: '200000'
      max_stocks:
        description: '限制掃描股票數量，0代表全部249檔(第一次測試建議先設50，跑比較快)'
        required: false
        default: '50'
      top_n:
        description: '多方/空方各自取前幾名候選(預設5，同時最多可能有2倍這個數字的部位)'
        required: false
        default: '5'
      atr_stop_mult:
        description: 'ATR保護性停損倍數(安全網，不是主要出場依據，主要出場依據是固定持有天數)'
        required: false
        default: '2.0'
      slippage_pct:
        description: '進場/停損出場的滑價假設，例如0.002代表0.2%，留空或0代表不模擬滑價'
        required: false
        default: '0'
      max_concurrent_positions:
        description: '同時最多持有的部位數，留空代表2倍top_n(多空雙向各top_n名都進場)'
        required: false
        default: ''
      trailing_months:
        description: '算「月營收意外」用的過去幾個月平均視窗，預設6個月'
        required: false
        default: '6'
      refresh_revenue_cache:
        description: '強制重新抓月營收資料，忽略revenue_cache快取(true)。⚠️第一次執行如果回報「確認無資料」(0筆)，之後cache@v4會把這個「沒資料」的結果原封不動快取下來，之後每次重跑都會直接讀到同一批空結果，不會自動重試——如果上一次結果是0筆事件，這次務必設true，否則改完程式碼也看不到效果'
        required: false
        default: 'false'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore price data cache
        uses: actions/cache@v4
        with:
          path: data_cache
          key: price-data-cache-${{ github.run_id }}
          restore-keys: |
            price-data-cache-

      - name: Restore revenue data cache
        uses: actions/cache@v4
        with:
          path: revenue_cache
          key: revenue-data-cache-${{ github.run_id }}
          restore-keys: |
            revenue-data-cache-

      - name: Run revenue drift backtest
        timeout-minutes: 150
        run: |
          ARGS="--starting-capital ${{ github.event.inputs.starting_capital }} --max-stocks ${{ github.event.inputs.max_stocks }}"
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            ARGS="$ARGS --start ${{ github.event.inputs.start_date }}"
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS="$ARGS --end ${{ github.event.inputs.end_date }}"
          fi
          if [ -n "${{ github.event.inputs.top_n }}" ]; then
            ARGS="$ARGS --top-n ${{ github.event.inputs.top_n }}"
          fi
          if [ -n "${{ github.event.inputs.atr_stop_mult }}" ]; then
            ARGS="$ARGS --atr-stop-mult ${{ github.event.inputs.atr_stop_mult }}"
          fi
          if [ -n "${{ github.event.inputs.slippage_pct }}" ] && [ "${{ github.event.inputs.slippage_pct }}" != "0" ]; then
            ARGS="$ARGS --slippage-pct ${{ github.event.inputs.slippage_pct }}"
          fi
          if [ -n "${{ github.event.inputs.max_concurrent_positions }}" ]; then
            ARGS="$ARGS --max-concurrent-positions ${{ github.event.inputs.max_concurrent_positions }}"
          fi
          if [ -n "${{ github.event.inputs.trailing_months }}" ]; then
            ARGS="$ARGS --trailing-months ${{ github.event.inputs.trailing_months }}"
          fi
          if [ "${{ github.event.inputs.refresh_revenue_cache }}" = "true" ]; then
            ARGS="$ARGS --refresh"
          fi
          python compare_revenue_drift.py $ARGS

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: revenue-drift-results
          path: results_revenue_drift/
