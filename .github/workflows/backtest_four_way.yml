name: TX History Data Validation (社群1分鐘K棒 vs TAIFEX官方日線)

on:
  workflow_dispatch:
    inputs:
      period_1998_2000:
        description: '是否下載1998.07.22~2000.12.31這段'
        required: false
        default: 'false'
      period_2001_2010:
        description: '是否下載2001.01.01~2010.12.31這段'
        required: false
        default: 'false'
      period_2011_2020:
        description: '是否下載2011.01.01~2020.12.31這段(預設驗證的其中一段)'
        required: false
        default: 'true'
      period_2021_2023:
        description: '是否下載2021.01.01~2023.12.31這段(預設驗證的其中一段)'
        required: false
        default: 'true'
      n_sample_dates:
        description: '抽樣比對幾個交易日(平均分散，不是逐日全面稽核)'
        required: false
        default: '30'
      tolerance_pct:
        description: '收盤價誤差容忍範圍(百分比，例如0.1代表0.1%)'
        required: false
        default: '0.1'
      refresh_cache:
        description: '強制重新下載(忽略快取)。⚠️快取會用github actions cache跨次執行保留，loader程式碼有更新(例如修過bug)後第一次重跑，務必開true，之後正常跑可以關掉'
        required: false
        default: 'false'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore history data cache
        uses: actions/cache@v4
        with:
          path: |
            taifex_history_cache
          key: tx-history-data-cache-${{ github.run_id }}
          restore-keys: |
            tx-history-data-cache-

      - name: 跑單元測試（先確認loader/比對邏輯沒有壞掉，再花時間跑真實下載）
        run: |
          python3 -m pytest test_taifex_history_loader.py -v

      - name: Build period list from checkboxes
        id: periods
        run: |
          PERIODS=""
          if [ "${{ github.event.inputs.period_1998_2000 }}" = "true" ]; then
            PERIODS="$PERIODS 1998_2000"
          fi
          if [ "${{ github.event.inputs.period_2001_2010 }}" = "true" ]; then
            PERIODS="$PERIODS 2001_2010"
          fi
          if [ "${{ github.event.inputs.period_2011_2020 }}" = "true" ]; then
            PERIODS="$PERIODS 2011_2020"
          fi
          if [ "${{ github.event.inputs.period_2021_2023 }}" = "true" ]; then
            PERIODS="$PERIODS 2021_2023"
          fi
          if [ -z "$PERIODS" ]; then
            PERIODS="2011_2020 2021_2023"
          fi
          echo "periods=$PERIODS" >> "$GITHUB_OUTPUT"

      - name: Run TX history accuracy validation (社群1分鐘K棒 vs TAIFEX官方日線，抽樣比對)
        timeout-minutes: 45
        run: |
          ARGS="--periods ${{ steps.periods.outputs.periods }}"
          ARGS="$ARGS --n-sample-dates ${{ github.event.inputs.n_sample_dates }}"
          ARGS="$ARGS --tolerance-pct ${{ github.event.inputs.tolerance_pct }}"
          if [ "${{ github.event.inputs.refresh_cache }}" = "true" ]; then
            ARGS="$ARGS --refresh-cache"
          fi
          python validate_tx_history_accuracy.py $ARGS

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        with:
          name: tx-history-validation-report
          path: results_tx_history_validation/
