name: Run Strategy Backtest (Score & Sizing)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '回測起始日期 (YYYY-MM-DD)'
        required: false
        default: '2023-01-01'
      end_date:
        description: '回測結束日期，留空代表跑到今天'
        required: false
        default: ''
      risk_per_trade:
        description: '風險動態調整口數模式：每筆交易願意承受的風險金額(新台幣)'
        required: false
        default: '20000'
      starting_capital:
        description: '模擬帳戶起始資金(新台幣)'
        required: false
        default: '1000000'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run four-way backtest
        run: |
          ARGS="--start ${{ github.event.inputs.start_date }} --risk-per-trade ${{ github.event.inputs.risk_per_trade }} --starting-capital ${{ github.event.inputs.starting_capital }}"
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS="$ARGS --end ${{ github.event.inputs.end_date }}"
          fi
          python compare_four_way.py $ARGS

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-four-way-results
          path: results_four_way/
