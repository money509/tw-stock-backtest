name: 台指期1小時K棒 擠壓+KDJ 預覽(小樣本，不是驗證)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '要跑哪個出場變體：a(原規則)/b(ATR框架)/both(兩個都跑，預設)'
        required: false
        default: 'both'
      contract:
        description: '契約規格：big(大台指，NT$200/點，預設)/mini(小台指，NT$50/點)'
        required: false
        default: 'big'
      refresh_cache:
        description: '是否忽略今天已有的快取、重新向TAIFEX下載(true/false)'
        required: false
        default: 'false'

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TX hourly squeeze+KDJ preview (30-day free window only, not a validation)
        run: |
          ARGS="--variant ${{ github.event.inputs.variant }} --contract ${{ github.event.inputs.contract }}"
          if [ "${{ github.event.inputs.refresh_cache }}" = "true" ]; then
            ARGS="$ARGS --refresh-cache"
          fi
          python squeeze_kdj_tx_hourly_preview.py $ARGS

      - name: Upload results (preview only, small sample)
        uses: actions/upload-artifact@v4
        with:
          name: tx-hourly-squeeze-kdj-preview
          path: results_tx_hourly_preview/
