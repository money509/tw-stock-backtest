name: Run Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: '回測起始日期 (YYYY-MM-DD)'
        required: false
        default: '2023-01-01'
      end_date:
        description: '回測結束日期，留空代表跑到今天'
        required: false
        default: ''

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backtest
        run: |
          if [ -z "${{ github.event.inputs.end_date }}" ]; then
            python compare.py --start "${{ github.event.inputs.start_date }}"
          else
            python compare.py --start "${{ github.event.inputs.start_date }}" --end "${{ github.event.inputs.end_date }}"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: results/
